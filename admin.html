<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>จัดการแคตตาล็อค — Rukkhun Medical</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chonburi&family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
  .table-wrap{ border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; background:var(--paper-raised); }
  .prod-table{ font-size:13.5px; }
  .prod-table th{ white-space:nowrap; }
  .prod-table td{ vertical-align:middle; }
  .row-thumb{ width:42px; height:42px; border-radius:8px; object-fit:cover; background:var(--paper-sunken); }
  .row-name{ font-weight:600; }
  .row-brand{ font-size:12px; color:var(--ink-faint); }
  .row-actions{ display:flex; gap:6px; white-space:nowrap; }
  .margin-pos{ color:var(--accent-strong); font-weight:600; }
  .margin-neg{ color:var(--danger); font-weight:600; }
  .conn-badge{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-family:var(--font-heading);
    padding:4px 10px; border-radius:999px; border:1px solid var(--border); }
  .conn-ok{ color:var(--accent-strong); border-color:var(--accent); background:var(--accent-soft); }
  .conn-bad{ color:var(--danger); border-color:var(--danger); background:var(--danger-soft); }
  .conn-wait{ color:var(--ink-soft); }
  .settings-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .stack-btn{ display:flex; flex-direction:column; gap:8px; }
  .save-bar{ position:sticky; bottom:0; background:var(--paper-raised); border-top:1px solid var(--border);
    padding:12px 16px; display:flex; align-items:center; gap:12px; border-radius:var(--radius-lg) var(--radius-lg) 0 0;
    box-shadow:var(--shadow-lg); margin-top:20px; }
  .save-bar .status{ font-size:13px; color:var(--ink-soft); flex:1; }
</style>
</head>
<body>

<div id="app">
  <div class="shell"><p style="color:var(--ink-faint)">กำลังโหลด…</p></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="assets/github-api.js"></script>
<script>
(function(){
  'use strict';

  var CONFIG = {
    owner: 'RockyRukkhun',
    publicRepo: 'Rukkhun-Medical-Catalog',
    internalRepo: 'Rukkhun-Medical-Catalog-internal',
    publicDataPath: 'data/products-public.json',
    internalDataPath: 'data/products-internal.json',
    branch: 'main'
  };
  var TOKEN_KEY = 'rukkhun_catalog_admin_token_v1';

  var state = {
    business: { name:'', tagline:'', phone:'', line:'', email:'', address:'', logo:'' },
    products: [],
    publicSha: null,
    internalSha: null,
    token: localStorage.getItem(TOKEN_KEY) || '',
    connStatus: 'unknown',  // unknown | checking | ok | bad
    connMsg: '',
    loaded: false,
    saving: false
  };
  var ui = { query:'', category:'ทั้งหมด', modal:null, editId:null, importState:null };

  function $(sel, root){ return (root||document).querySelector(sel); }
  function $all(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
  function uid(){ return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function escapeAttr(s){ return escapeHtml(s); }
  function formatPrice(n){
    if (n===''||n==null||isNaN(n)) return '-';
    var num = Number(n);
    return num.toLocaleString('th-TH', { minimumFractionDigits:(num%1===0)?0:2, maximumFractionDigits:2 });
  }
  function rawUrl(path){
    return 'https://raw.githubusercontent.com/' + CONFIG.owner + '/' + CONFIG.publicRepo + '/' + CONFIG.branch + '/' + path;
  }

  /* ---------------- boot / connection ---------------- */

  function boot(){
    render();
    if (state.token) testAndLoad();
  }

  function saveTokenAndTest(tok){
    state.token = tok.trim();
    try { localStorage.setItem(TOKEN_KEY, state.token); } catch(e){}
    testAndLoad();
  }

  function testAndLoad(){
    if (!state.token){ state.connStatus='bad'; state.connMsg='ยังไม่ได้ใส่กุญแจ'; render(); return; }
    state.connStatus = 'checking'; render();
    Promise.all([
      GH.testRepo(CONFIG.owner, CONFIG.publicRepo, state.token),
      GH.testRepo(CONFIG.owner, CONFIG.internalRepo, state.token)
    ]).then(function(){
      state.connStatus = 'ok'; state.connMsg = 'เชื่อมต่อสำเร็จ';
      return loadData();
    }).catch(function(err){
      state.connStatus = 'bad';
      state.connMsg = describeError(err);
      render();
    });
  }

  function loadData(){
    return Promise.all([
      GH.getJson(CONFIG.owner, CONFIG.publicRepo, CONFIG.publicDataPath, state.token, { business: state.business, products: [] }),
      GH.getJson(CONFIG.owner, CONFIG.internalRepo, CONFIG.internalDataPath, state.token, { costs: {} })
    ]).then(function(results){
      var pub = results[0], intl = results[1];
      state.publicSha = pub.sha;
      state.internalSha = intl.sha;
      state.business = Object.assign({ name:'', tagline:'', phone:'', line:'', email:'', address:'', logo:'' }, pub.json.business || {});
      var costs = (intl.json && intl.json.costs) || {};
      state.products = (pub.json.products || []).map(function(p){
        var c = costs[p.id] || {};
        return {
          id: p.id,
          name: p.name || '',
          brand: p.brand || '',
          category: p.category || '',
          description: p.description || '',
          price: (p.price != null ? p.price : 0),
          sku: p.sku || '',
          unit: p.unit || '',
          status: p.status || 'available',
          updatedAt: p.updatedAt || Date.now(),
          images: (p.images || []).map(function(path){ return { type:'existing', path: path, url: rawUrl(path) }; }),
          cost: (c.cost != null ? c.cost : ''),
          supplier: c.supplier || ''
        };
      });
      state.loaded = true;
      toast('โหลดข้อมูลล่าสุดแล้ว (' + state.products.length + ' รายการ)');
      render();
    }).catch(function(err){
      state.connStatus = 'bad';
      state.connMsg = describeError(err);
      render();
    });
  }

  function describeError(err){
    if (!err) return 'เกิดข้อผิดพลาดไม่ทราบสาเหตุ';
    if (err.status === 401) return 'กุญแจไม่ถูกต้องหรือหมดอายุ ตรวจสอบ Personal Access Token';
    if (err.status === 403) return 'กุญแจนี้ไม่มีสิทธิ์เข้าถึง repository (ตรวจสอบ Contents: Read and write)';
    if (err.status === 404) return 'ไม่พบ repository — ตรวจชื่อ owner/repo ในโค้ด (' + CONFIG.owner + '/' + CONFIG.publicRepo + ', ' + CONFIG.owner + '/' + CONFIG.internalRepo + ')';
    if (err.status === 409) return 'ข้อมูลถูกแก้ไขจากที่อื่นระหว่างนี้ กรุณากด "โหลดข้อมูลล่าสุด" แล้วลองใหม่';
    return err.message || 'เชื่อมต่อไม่สำเร็จ';
  }

  function toast(msg){
    var stack = $('#toast-stack');
    if (!stack) return;
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    stack.appendChild(el);
    setTimeout(function(){ el.remove(); }, 3600);
  }

  /* ---------------- computed ---------------- */

  function categories(){
    var set = [];
    state.products.forEach(function(p){
      var c = (p.category||'').trim();
      if (c && set.indexOf(c) === -1) set.push(c);
    });
    return set;
  }
  function filteredProducts(){
    var q = ui.query.trim().toLowerCase();
    return state.products.filter(function(p){
      if (ui.category !== 'ทั้งหมด' && (p.category||'') !== ui.category) return false;
      if (!q) return true;
      var hay = (p.name+' '+p.brand+' '+p.category+' '+p.description).toLowerCase();
      return hay.indexOf(q) !== -1;
    });
  }
  function marginInfo(price, cost){
    price = Number(price)||0; cost = (cost===''||cost==null) ? null : Number(cost);
    if (cost == null) return { profit:null, pct:null };
    var profit = price - cost;
    var pct = price > 0 ? (profit/price*100) : 0;
    return { profit: profit, pct: pct };
  }

  /* ---------------- render ---------------- */

  function render(){
    var html = '';
    html += renderConnPanel();
    if (state.loaded){
      html += renderMainApp();
    } else {
      html += '<div class="shell"><div class="empty-state" style="margin-top:20px;">' +
        '<div class="empty-icon">🔌</div><h2>ยังไม่ได้เชื่อมต่อ GitHub</h2>' +
        '<p>ใส่ Personal Access Token ด้านบนแล้วกด "เชื่อมต่อ" เพื่อโหลดข้อมูลแคตตาล็อค</p>' +
        '</div></div>';
    }
    html += renderModal();
    html += '<div class="toast-stack" id="toast-stack"></div>';
    $('#app').innerHTML = html;
    bindOnce();
    bindFrame();
  }

  function renderConnPanel(){
    var badge = '';
    if (state.connStatus === 'ok') badge = '<span class="conn-badge conn-ok">● เชื่อมต่อแล้ว</span>';
    else if (state.connStatus === 'bad') badge = '<span class="conn-badge conn-bad">● ' + escapeHtml(state.connMsg) + '</span>';
    else if (state.connStatus === 'checking') badge = '<span class="conn-badge conn-wait"><span class="spinner"></span> กำลังเชื่อมต่อ…</span>';
    else badge = '<span class="conn-badge conn-wait">ยังไม่ได้เชื่อมต่อ</span>';

    return (
      '<div class="shell" style="padding-bottom:0;">' +
        '<div style="background:var(--paper-raised);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:8px;">' +
          '<div class="settings-row">' +
            '<strong style="font-family:var(--font-heading);font-size:14px;">การเชื่อมต่อ GitHub</strong>' + badge +
            (state.loaded ? '<button type="button" class="btn btn-outline btn-sm" data-action="reload-data" style="margin-left:auto;">โหลดข้อมูลล่าสุด</button>' : '') +
          '</div>' +
          '<div class="settings-row">' +
            '<input type="password" id="gh-token-input" placeholder="วาง Personal Access Token ที่นี่" ' +
              'style="flex:1;min-width:220px;padding:9px 12px;border-radius:999px;border:1px solid var(--border);background:var(--paper);color:var(--ink);" ' +
              'value="' + (state.token ? '••••••••••••••••' : '') + '">' +
            '<button type="button" class="btn btn-primary btn-sm" data-action="connect">เชื่อมต่อ</button>' +
          '</div>' +
          '<p class="field-hint">กุญแจนี้บันทึกไว้ในเบราว์เซอร์นี้เท่านั้น ไม่ถูกส่งไปที่อื่นนอกจาก GitHub · repo: ' +
            escapeHtml(CONFIG.owner) + '/' + escapeHtml(CONFIG.publicRepo) + ' และ ' + escapeHtml(CONFIG.internalRepo) +
          '</p>' +
        '</div>' +
      '</div>'
    );
  }

  function renderMainApp(){
    var b = state.business;
    var contactBits = [];
    if (b.phone) contactBits.push('โทร ' + escapeHtml(b.phone));
    if (b.line) contactBits.push('LINE: ' + escapeHtml(b.line));
    if (b.email) contactBits.push(escapeHtml(b.email));

    return (
      '<div class="shell" style="padding-top:0;">' +
        '<header class="topbar">' +
          '<div class="brand">' +
            '<div class="brand-mark">' + (b.logo ? '<img src="'+b.logo+'" alt="โลโก้">' : '🏥') + '</div>' +
            '<div class="brand-text">' +
              '<h1 class="brand-name' + (b.name?'':' placeholder') + '">' + escapeHtml(b.name || 'ชื่อร้านของคุณ') + '</h1>' +
              '<p class="brand-tagline">' + escapeHtml(b.tagline || 'หน้าจัดการแคตตาล็อค') + '</p>' +
              (contactBits.length ? '<p class="brand-contact">'+contactBits.join(' &nbsp;•&nbsp; ')+'</p>' : '') +
            '</div>' +
          '</div>' +
          '<div class="brand-actions"><button type="button" class="btn btn-ghost" data-action="edit-business">แก้ไขข้อมูลร้าน</button></div>' +
        '</header>' +

        '<div class="toolbar">' +
          '<div class="search-wrap"><input type="search" id="search-input" placeholder="ค้นหาสินค้า..." value="'+escapeAttr(ui.query)+'"></div>' +
          '<div class="toolbar-actions">' +
            '<button type="button" class="btn btn-primary" data-action="add-product">+ เพิ่มสินค้า</button>' +
            '<button type="button" class="btn btn-outline" data-action="import-open">นำเข้าจาก Excel</button>' +
            '<button type="button" class="btn btn-outline" data-action="export-csv">ส่งออก CSV</button>' +
          '</div>' +
          (state.products.length ? '<div class="filter-pills">'+renderPills()+'</div>' : '') +
        '</div>' +

        renderTable() +

        '<div class="save-bar">' +
          '<span class="status">' + (state.saving ? '<span class="spinner"></span> กำลังบันทึกขึ้น GitHub…' : (state.products.length + ' รายการ · แก้ไขแล้วต้องกดบันทึกเพื่อเผยแพร่')) + '</span>' +
          '<button type="button" class="btn btn-primary" data-action="save-all"' + (state.saving?' disabled':'') + '>บันทึก & เผยแพร่</button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderPills(){
    var cats = categories();
    var all = [{ name:'ทั้งหมด', count: state.products.length }].concat(
      cats.map(function(c){ return { name:c, count: state.products.filter(function(p){ return p.category===c; }).length }; })
    );
    return all.map(function(c){
      return '<button type="button" class="pill-filter'+(ui.category===c.name?' active':'')+'" data-action="filter-category" data-cat="'+escapeAttr(c.name)+'">'+
        escapeHtml(c.name)+' <span class="count">'+c.count+'</span></button>';
    }).join('');
  }

  function renderTable(){
    var list = filteredProducts();
    if (!state.products.length){
      return '<div class="empty-state"><div class="empty-icon">🗂️</div><h2>ยังไม่มีสินค้า</h2>' +
        '<p>กด "+ เพิ่มสินค้า" หรือ "นำเข้าจาก Excel" เพื่อเริ่มต้น</p>' +
        '<button type="button" class="btn btn-primary" data-action="add-product">+ เพิ่มสินค้าแรก</button></div>';
    }
    if (!list.length){
      return '<div class="empty-state"><div class="empty-icon">🔍</div><h2>ไม่พบสินค้าที่ค้นหา</h2></div>';
    }
    var rows = list.map(function(p){
      var thumb = p.images[0] ? (p.images[0].url || p.images[0].dataUrl) : '';
      var m = marginInfo(p.price, p.cost);
      var pctTxt = m.pct==null ? '—' : (m.pct.toFixed(0) + '%');
      var pctClass = m.pct==null ? '' : (m.pct >= 0 ? 'margin-pos' : 'margin-neg');
      return '<tr>' +
        '<td>' + (thumb ? '<img class="row-thumb" src="'+thumb+'" alt="">' : '<div class="row-thumb" style="display:flex;align-items:center;justify-content:center;color:var(--ink-faint);">–</div>') + '</td>' +
        '<td><div class="row-name">'+escapeHtml(p.name)+'</div>' + (p.brand?'<div class="row-brand">'+escapeHtml(p.brand)+'</div>':'') + '</td>' +
        '<td>'+escapeHtml(p.category||'—')+'</td>' +
        '<td style="text-align:right;font-variant-numeric:tabular-nums;">'+formatPrice(p.price)+'</td>' +
        '<td style="text-align:right;font-variant-numeric:tabular-nums;color:var(--internal);">'+ (p.cost===''? '—' : formatPrice(p.cost)) +'</td>' +
        '<td style="text-align:right;" class="'+pctClass+'">'+pctTxt+'</td>' +
        '<td class="row-actions">' +
          '<button type="button" class="icon-btn" data-action="edit-product" data-id="'+p.id+'" aria-label="แก้ไข">✎</button>' +
          '<button type="button" class="icon-btn danger" data-action="delete-product" data-id="'+p.id+'" aria-label="ลบ">🗑</button>' +
        '</td>' +
      '</tr>';
    }).join('');
    return '<div class="table-wrap"><div class="twrap"><table class="prod-table"><thead><tr>' +
      '<th></th><th>สินค้า</th><th>หมวดหมู่</th><th style="text-align:right;">ราคาขาย</th>' +
      '<th style="text-align:right;">ต้นทุน</th><th style="text-align:right;">กำไร%</th><th></th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  }

  /* ---------------- modal ---------------- */

  function renderModal(){
    if (!ui.modal) return '';
    if (ui.modal === 'product') return renderProductModal();
    if (ui.modal === 'delete') return renderDeleteModal();
    if (ui.modal === 'business') return renderBusinessModal();
    if (ui.modal === 'import') return renderImportModal();
    return '';
  }

  function renderProductModal(){
    var editing = ui.editId ? state.products.find(function(p){ return p.id===ui.editId; }) : null;
    var work = editing ? editing : { images:[], name:'', brand:'', category:'', description:'', price:'', cost:'', supplier:'', sku:'', unit:'' };
    if (!editing && ui.draftImages) work.images = ui.draftImages;
    var cats = categories();
    var m = marginInfo(work.price, work.cost);
    var gallery = work.images.map(function(im, idx){
      var src = im.url || im.dataUrl;
      return '<div class="image-thumb"><img src="'+src+'" alt="">' +
        (idx===0 ? '<span class="main-badge">หลัก</span>' : '') +
        '<button type="button" class="rm-thumb" data-action="remove-image" data-idx="'+idx+'">✕</button></div>';
    }).join('');
    return (
      '<div class="modal-overlay" data-action="overlay-close">' +
        '<div class="modal modal-wide" data-stop>' +
          '<div class="modal-head"><h2>'+(editing?'แก้ไขสินค้า':'เพิ่มสินค้าใหม่')+'</h2>' +
            '<button type="button" class="modal-close" data-action="close-modal">✕</button></div>' +
          '<form id="product-form">' +
            '<div class="field">' +
              '<label>รูปภาพสินค้า (เพิ่มได้หลายรูป รูปแรก = รูปหลัก)</label>' +
              '<div class="image-gallery" id="image-gallery">' + gallery +
                '<label class="image-add-tile">+<input type="file" accept="image/*" id="image-input" multiple hidden></label>' +
              '</div>' +
            '</div>' +
            '<div class="field-2col">' +
              '<div class="field"><label for="f-name">ชื่อสินค้า *</label><input type="text" id="f-name" maxlength="120" value="'+escapeAttr(work.name)+'"></div>' +
              '<div class="field"><label for="f-brand">ยี่ห้อ / รุ่น</label><input type="text" id="f-brand" maxlength="80" value="'+escapeAttr(work.brand)+'"></div>' +
            '</div>' +
            '<div class="field-2col">' +
              '<div class="field"><label for="f-category">หมวดหมู่</label><input type="text" id="f-category" list="category-options" maxlength="60" value="'+escapeAttr(work.category)+'">' +
                '<datalist id="category-options">'+cats.map(function(c){return '<option value="'+escapeAttr(c)+'">';}).join('')+'</datalist></div>' +
              '<div class="field"><label for="f-price">ราคาขาย (บาท) *</label><input type="number" id="f-price" min="0" step="0.01" value="'+(work.price===''?'':work.price)+'"></div>' +
            '</div>' +
            '<div class="field"><label for="f-desc">รายละเอียด / สเปคสินค้า</label><textarea id="f-desc" rows="3" maxlength="600">'+escapeHtml(work.description)+'</textarea></div>' +

            '<div class="internal-block">' +
              '<div class="internal-label">🔒 ข้อมูลภายใน — ไม่เผยแพร่ขึ้นเว็บสาธารณะ</div>' +
              '<div class="field-2col">' +
                '<div class="field" style="margin-bottom:8px;"><label for="f-cost">ต้นทุน (บาท)</label><input type="number" id="f-cost" min="0" step="0.01" value="'+(work.cost===''?'':work.cost)+'"></div>' +
                '<div class="field" style="margin-bottom:8px;"><label for="f-supplier">ผู้จัดจำหน่าย</label><input type="text" id="f-supplier" maxlength="80" value="'+escapeAttr(work.supplier)+'"></div>' +
              '</div>' +
              '<p id="margin-preview" style="font-size:13px;color:var(--internal);font-family:var(--font-heading);">' +
                (m.pct==null ? 'ใส่ต้นทุนเพื่อดูกำไร' : ('กำไร ' + formatPrice(m.profit) + ' บาท/ชิ้น (' + m.pct.toFixed(1) + '%)')) +
              '</p>' +
            '</div>' +

            '<p class="field-error" id="form-error" hidden></p>' +
            '<div class="modal-actions">' +
              '<button type="button" class="btn btn-ghost" data-action="close-modal">ยกเลิก</button>' +
              '<button type="submit" class="btn btn-primary">บันทึกลงรายการ</button>' +
            '</div>' +
          '</form>' +
        '</div>' +
      '</div>'
    );
  }

  function renderDeleteModal(){
    var p = state.products.find(function(x){ return x.id===ui.editId; });
    if (!p) return '';
    return (
      '<div class="modal-overlay" data-action="overlay-close">' +
        '<div class="modal modal-sm" data-stop>' +
          '<h2>ลบสินค้านี้ใช่ไหม?</h2>' +
          '<p>"'+escapeHtml(p.name)+'" จะถูกลบออกจากรายการ (ต้องกด "บันทึก & เผยแพร่" อีกครั้งเพื่อให้มีผลจริง)</p>' +
          '<div class="modal-actions">' +
            '<button type="button" class="btn btn-ghost" data-action="close-modal">ยกเลิก</button>' +
            '<button type="button" class="btn btn-danger" data-action="confirm-delete" data-id="'+p.id+'">ลบสินค้า</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function renderBusinessModal(){
    var b = state.business;
    return (
      '<div class="modal-overlay" data-action="overlay-close">' +
        '<div class="modal" data-stop>' +
          '<div class="modal-head"><h2>แก้ไขข้อมูลร้าน</h2><button type="button" class="modal-close" data-action="close-modal">✕</button></div>' +
          '<form id="business-form">' +
            '<div class="field"><label for="b-name">ชื่อร้าน</label><input type="text" id="b-name" maxlength="80" value="'+escapeAttr(b.name)+'"></div>' +
            '<div class="field"><label for="b-tagline">คำโปรย / สโลแกน</label><input type="text" id="b-tagline" maxlength="120" value="'+escapeAttr(b.tagline)+'"></div>' +
            '<div class="field"><label for="b-phone">เบอร์โทร</label><input type="text" id="b-phone" maxlength="40" value="'+escapeAttr(b.phone)+'"></div>' +
            '<div class="field"><label for="b-line">LINE ID</label><input type="text" id="b-line" maxlength="40" value="'+escapeAttr(b.line)+'"></div>' +
            '<div class="field"><label for="b-email">อีเมล</label><input type="text" id="b-email" maxlength="80" value="'+escapeAttr(b.email)+'"></div>' +
            '<div class="field"><label for="b-address">ที่อยู่ / พื้นที่จัดส่ง</label><textarea id="b-address" rows="2" maxlength="200">'+escapeHtml(b.address)+'</textarea></div>' +
            '<div class="modal-actions">' +
              '<button type="button" class="btn btn-ghost" data-action="close-modal">ยกเลิก</button>' +
              '<button type="submit" class="btn btn-primary">บันทึกลงรายการ</button>' +
            '</div>' +
          '</form>' +
        '</div>' +
      '</div>'
    );
  }

  function renderImportModal(){
    var st = ui.importState;
    if (!st || st.stage === 'pick'){
      return (
        '<div class="modal-overlay" data-action="overlay-close">' +
          '<div class="modal" data-stop>' +
            '<div class="modal-head"><h2>นำเข้าสินค้าจาก Excel</h2><button type="button" class="modal-close" data-action="close-modal">✕</button></div>' +
            '<p style="margin-bottom:14px;color:var(--ink-soft);font-size:13.5px;">เลือกไฟล์ .xlsx, .xls หรือ .csv จากนั้นจับคู่คอลัมน์ก่อนนำเข้าจริง (ต้นทุนใส่ได้ถ้ามีคอลัมน์นี้ในไฟล์)</p>' +
            '<label class="btn btn-primary file-btn" style="width:100%;justify-content:center;">เลือกไฟล์<input type="file" accept=".xlsx,.xls,.csv" id="import-file-input" hidden></label>' +
            '<p class="field-error" id="import-error" hidden></p>' +
            '<div class="modal-actions"><button type="button" class="btn btn-ghost" data-action="close-modal">ยกเลิก</button></div>' +
          '</div>' +
        '</div>'
      );
    }
    var headers = st.headers, rows = st.dataRows, mapping = st.mapping;
    function mapSelect(field, label){
      var opts = '<option value="-1">— ไม่ใช้ —</option>' + headers.map(function(h,i){
        return '<option value="'+i+'"'+(mapping[field]===i?' selected':'')+'>'+escapeHtml(h || ('คอลัมน์ '+(i+1)))+'</option>';
      }).join('');
      return '<div class="field"><label>'+label+'</label><select data-map-field="'+field+'" class="import-map-select">'+opts+'</select></div>';
    }
    var validCount = buildImportList(st).length;
    return (
      '<div class="modal-overlay" data-action="overlay-close">' +
        '<div class="modal modal-wide" data-stop>' +
          '<div class="modal-head"><h2>จับคู่คอลัมน์</h2><button type="button" class="modal-close" data-action="close-modal">✕</button></div>' +
          '<div class="field-2col">' +
            mapSelect('name','ชื่อสินค้า *') + mapSelect('price','ราคาขาย *') +
            mapSelect('brand','ยี่ห้อ/รุ่น') + mapSelect('category','หมวดหมู่') +
            mapSelect('description','รายละเอียด') + mapSelect('cost','ต้นทุน (ถ้ามี)') +
          '</div>' +
          '<label style="display:flex;align-items:center;gap:8px;margin:4px 0 14px;font-size:13.5px;color:var(--ink-soft);">' +
            '<input type="checkbox" id="import-skip-dup"'+(st.skipDuplicates?' checked':'')+'> ข้ามรายการที่ชื่อซ้ำกับสินค้าที่มีอยู่แล้ว' +
          '</label>' +
          '<p class="field-error" id="import-error" hidden></p>' +
          '<div class="modal-actions">' +
            '<button type="button" class="btn btn-ghost" data-action="close-modal">ยกเลิก</button>' +
            '<button type="button" class="btn btn-primary" data-action="import-confirm">นำเข้า '+validCount+' รายการ</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  /* ---------------- events ---------------- */

  var frameBound = false;
  function bindFrame(){
    var tokenInput = $('#gh-token-input');
    if (tokenInput){
      tokenInput.addEventListener('focus', function(e){ if (state.token) e.target.value=''; });
    }
    var form = $('#product-form');
    if (form) form.addEventListener('submit', function(e){ e.preventDefault(); submitProductForm(); });
    var bizForm = $('#business-form');
    if (bizForm) bizForm.addEventListener('submit', function(e){ e.preventDefault(); submitBusinessForm(); });
    var search = $('#search-input');
    if (search) search.addEventListener('input', function(e){ ui.query = e.target.value; render(); });

    var imgInput = $('#image-input');
    if (imgInput){
      imgInput.addEventListener('change', function(e){
        var files = Array.prototype.slice.call(e.target.files || []);
        if (!files.length) return;
        var editing = ui.editId ? state.products.find(function(p){ return p.id===ui.editId; }) : null;
        var targetArr = editing ? editing.images : (ui.draftImages || (ui.draftImages=[]));
        Promise.all(files.map(compressImage)).then(function(dataUrls){
          dataUrls.forEach(function(du){ targetArr.push({ type:'new', dataUrl: du }); });
          render();
        }).catch(function(){ toast('ไม่สามารถอ่านไฟล์รูปบางไฟล์ได้'); });
      });
    }
    var cf = $('#f-cost'), pf = $('#f-price');
    function updateMarginPreview(){
      var el = $('#margin-preview');
      if (!el) return;
      var m = marginInfo(pf?pf.value:0, cf?cf.value:'');
      el.textContent = m.pct==null ? 'ใส่ต้นทุนเพื่อดูกำไร' : ('กำไร ' + formatPrice(m.profit) + ' บาท/ชิ้น (' + m.pct.toFixed(1) + '%)');
    }
    if (cf) cf.addEventListener('input', updateMarginPreview);
    if (pf) pf.addEventListener('input', updateMarginPreview);

    var importFileInput = $('#import-file-input');
    if (importFileInput){
      importFileInput.addEventListener('change', function(e){
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        parseImportFile(file).then(function(rows){
          if (!rows.length){ showImportError('ไม่พบข้อมูลในไฟล์นี้'); return; }
          var headers = (rows[0]||[]).map(function(h){ return String(h==null?'':h).trim(); });
          var dataRows = rows.slice(1);
          var mapping = guessMapping(headers);
          if (mapping.name === -1 && mapping.price === -1){
            mapping = { name:0, brand:-1, category: headers.length>2?1:-1, description: headers.length>3?2:-1, price: Math.max(headers.length-1,0), cost:-1 };
          }
          ui.importState = { stage:'map', headers:headers, dataRows:dataRows, mapping:mapping, skipDuplicates:true };
          render();
        }).catch(function(err){
          toast((err && err.message==='no-lib') ? 'ไม่สามารถโหลดตัวช่วยอ่านไฟล์ได้ ลองใหม่อีกครั้ง' : 'ไม่สามารถอ่านไฟล์นี้ได้ ตรวจสอบว่าเป็นไฟล์ Excel หรือ CSV ที่ถูกต้อง');
        });
      });
    }
    var importSkipDup = $('#import-skip-dup');
    if (importSkipDup) importSkipDup.addEventListener('change', function(e){ if (ui.importState){ ui.importState.skipDuplicates = e.target.checked; render(); } });
    $all('.import-map-select').forEach(function(sel){
      sel.addEventListener('change', function(e){
        if (!ui.importState) return;
        ui.importState.mapping[e.target.getAttribute('data-map-field')] = Number(e.target.value);
        render();
      });
    });
  }

  function bindOnce(){
    if (frameBound) return;
    frameBound = true;
    document.getElementById('app').addEventListener('click', function(e){
      var t = e.target.closest('[data-action]');
      if (!t) return;
      var action = t.getAttribute('data-action');
      if (action === 'overlay-close' && e.target === t){ closeModal(); return; }
      if (action === 'connect'){
        var val = $('#gh-token-input').value.trim();
        if (val && val.indexOf('•') === -1) saveTokenAndTest(val);
        else if (state.token) testAndLoad();
        return;
      }
      if (action === 'reload-data'){ loadData(); return; }
      if (action === 'add-product'){ ui.modal='product'; ui.editId=null; ui.draftImages=[]; render(); return; }
      if (action === 'edit-product'){ ui.modal='product'; ui.editId=t.getAttribute('data-id'); render(); return; }
      if (action === 'delete-product'){ ui.modal='delete'; ui.editId=t.getAttribute('data-id'); render(); return; }
      if (action === 'confirm-delete'){
        state.products = state.products.filter(function(p){ return p.id !== t.getAttribute('data-id'); });
        ui.modal=null; ui.editId=null; render();
        toast('ลบออกจากรายการแล้ว — อย่าลืมกด "บันทึก & เผยแพร่"');
        return;
      }
      if (action === 'edit-business'){ ui.modal='business'; render(); return; }
      if (action === 'close-modal'){ closeModal(); return; }
      if (action === 'remove-image'){
        var idx = Number(t.getAttribute('data-idx'));
        var editing = ui.editId ? state.products.find(function(p){ return p.id===ui.editId; }) : null;
        var arr = editing ? editing.images : ui.draftImages;
        if (arr) arr.splice(idx,1);
        render();
        return;
      }
      if (action === 'filter-category'){ ui.category = t.getAttribute('data-cat'); render(); return; }
      if (action === 'import-open'){ ui.modal='import'; ui.importState=null; render(); return; }
      if (action === 'import-confirm'){ commitImport(); return; }
      if (action === 'export-csv'){ exportCsv(); return; }
      if (action === 'save-all'){ saveAll(); return; }
    });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && ui.modal){ closeModal(); } });
  }

  function closeModal(){ ui.modal=null; ui.editId=null; ui.draftImages=null; ui.importState=null; render(); }
  function fieldVal(id){ var el = document.getElementById(id); return el ? el.value : ''; }

  function submitProductForm(){
    var name = fieldVal('f-name').trim();
    var priceRaw = fieldVal('f-price');
    if (!name){ showFormError('กรุณาใส่ชื่อสินค้า'); return; }
    if (priceRaw === '' || isNaN(Number(priceRaw)) || Number(priceRaw) < 0){ showFormError('กรุณาใส่ราคาขายที่ถูกต้อง'); return; }
    $('#form-error').hidden = true;

    var editing = ui.editId ? state.products.find(function(p){ return p.id===ui.editId; }) : null;
    var costRaw = fieldVal('f-cost');
    var data = {
      id: editing ? editing.id : uid(),
      name: name,
      brand: fieldVal('f-brand').trim(),
      category: fieldVal('f-category').trim(),
      description: fieldVal('f-desc').trim(),
      price: Number(priceRaw),
      cost: costRaw === '' ? '' : Number(costRaw),
      supplier: fieldVal('f-supplier').trim(),
      sku: editing ? editing.sku : '',
      unit: editing ? editing.unit : '',
      status: editing ? editing.status : 'available',
      images: editing ? editing.images : (ui.draftImages || []),
      updatedAt: Date.now()
    };
    if (editing){
      var idx = state.products.indexOf(editing);
      state.products[idx] = data;
    } else {
      state.products.push(data);
    }
    ui.modal=null; ui.editId=null; ui.draftImages=null;
    render();
    toast((editing?'แก้ไข':'เพิ่ม') + 'สินค้าในรายการแล้ว — อย่าลืมกด "บันทึก & เผยแพร่"');
  }

  function showFormError(msg){ var el = $('#form-error'); if (el){ el.textContent = msg; el.hidden = false; } }

  function submitBusinessForm(){
    state.business = {
      name: fieldVal('b-name').trim(), tagline: fieldVal('b-tagline').trim(),
      phone: fieldVal('b-phone').trim(), line: fieldVal('b-line').trim(),
      email: fieldVal('b-email').trim(), address: fieldVal('b-address').trim(),
      logo: state.business.logo || ''
    };
    ui.modal=null; render();
    toast('บันทึกข้อมูลร้านในรายการแล้ว — อย่าลืมกด "บันทึก & เผยแพร่"');
  }

  /* ---------------- image compression ---------------- */

  function compressImage(file, maxDim, quality){
    maxDim = maxDim || 900; quality = quality || 0.78;
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var w = img.width, h = img.height;
          if (w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
          else if (h >= w && h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,w,h);
          ctx.drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = function(){ reject(new Error('image load failed')); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(new Error('read failed')); };
      reader.readAsDataURL(file);
    });
  }

  /* ---------------- excel/csv import ---------------- */

  function parseImportFile(file){
    return new Promise(function(resolve, reject){
      if (typeof window.XLSX === 'undefined'){ reject(new Error('no-lib')); return; }
      var reader = new FileReader();
      reader.onload = function(e){
        try {
          var data = new Uint8Array(e.target.result);
          var wb = window.XLSX.read(data, { type:'array' });
          var ws = wb.Sheets[wb.SheetNames[0]];
          resolve(window.XLSX.utils.sheet_to_json(ws, { header:1, defval:'', blankrows:false }));
        } catch(err){ reject(err); }
      };
      reader.onerror = function(){ reject(new Error('read-failed')); };
      reader.readAsArrayBuffer(file);
    });
  }

  function guessMapping(headers){
    var syn = {
      name: ['ชื่อสินค้า','ชื่อ','name','product','สินค้า','item','title'],
      brand: ['ยี่ห้อ','รุ่น','brand','model'],
      category: ['หมวดหมู่','ประเภท','category','type','กลุ่ม'],
      description: ['รายละเอียด','สเปค','spec','description','detail','คำอธิบาย','desc'],
      price: ['ราคาขาย','ราคา','price','บาท','cost','amount'],
      cost: ['ต้นทุน','cost','cogs']
    };
    var mapping = { name:-1, brand:-1, category:-1, description:-1, price:-1, cost:-1 };
    headers.forEach(function(h, i){
      var hl = String(h||'').toLowerCase();
      Object.keys(syn).forEach(function(field){
        if (mapping[field] === -1 && syn[field].some(function(k){ return hl.indexOf(k.toLowerCase()) !== -1; })){
          mapping[field] = i;
        }
      });
    });
    return mapping;
  }

  function parsePrice(v){
    if (v===''||v==null) return 0;
    var n = Number(String(v).replace(/[, ]/g,''));
    return isNaN(n) ? 0 : n;
  }

  function buildImportList(st){
    var mapping = st.mapping;
    var existingNames = {};
    state.products.forEach(function(p){ existingNames[(p.name||'').trim().toLowerCase()] = true; });
    var out = [], seen = {};
    st.dataRows.forEach(function(r){
      var name = mapping.name>=0 ? String(r[mapping.name]==null?'':r[mapping.name]).trim() : '';
      if (!name) return;
      var key = name.toLowerCase();
      if (st.skipDuplicates && (existingNames[key] || seen[key])) return;
      seen[key] = true;
      out.push({
        id: uid(), name: name,
        brand: mapping.brand>=0 ? String(r[mapping.brand]==null?'':r[mapping.brand]).trim() : '',
        category: mapping.category>=0 ? String(r[mapping.category]==null?'':r[mapping.category]).trim() : '',
        description: mapping.description>=0 ? String(r[mapping.description]==null?'':r[mapping.description]).trim() : '',
        price: mapping.price>=0 ? parsePrice(r[mapping.price]) : 0,
        cost: mapping.cost>=0 ? parsePrice(r[mapping.cost]) : '',
        supplier: '', sku: '', unit: '', status: 'available',
        images: [], updatedAt: Date.now()
      });
    });
    return out;
  }

  function showImportError(msg){ var el = $('#import-error'); if (el){ el.textContent = msg; el.hidden = false; } }

  function commitImport(){
    var st = ui.importState;
    if (!st || st.stage !== 'map') return;
    var list = buildImportList(st);
    if (!list.length){ showImportError('ไม่พบรายการที่นำเข้าได้ ลองตรวจสอบการจับคู่คอลัมน์ชื่อสินค้าอีกครั้ง'); return; }
    state.products = state.products.concat(list);
    ui.modal = null; ui.importState = null;
    render();
    toast('นำเข้า ' + list.length + ' รายการแล้ว — อย่าลืมกด "บันทึก & เผยแพร่"');
  }

  /* ---------------- csv export (admin copy, includes cost) ---------------- */

  function csvCell(v){
    var s = (v===null||v===undefined) ? '' : String(v);
    if (/[",\n\r]/.test(s)){ s = '"' + s.replace(/"/g,'""') + '"'; }
    return s;
  }
  function exportCsv(){
    var rows = [['ชื่อสินค้า','ยี่ห้อ/รุ่น','หมวดหมู่','รายละเอียด','ราคาขาย','ต้นทุน','กำไร/ชิ้น','กำไร%','ผู้จัดจำหน่าย']];
    state.products.forEach(function(p){
      var m = marginInfo(p.price, p.cost);
      rows.push([p.name, p.brand, p.category, p.description, p.price,
        p.cost===''?'':p.cost, m.profit==null?'':m.profit, m.pct==null?'':m.pct.toFixed(1), p.supplier]);
    });
    var csv = '﻿' + rows.map(function(r){ return r.map(csvCell).join(','); }).join('\r\n');
    var blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'catalog-internal-' + Date.now() + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* ---------------- save to GitHub ---------------- */

  function saveAll(){
    if (!state.token){ toast('กรุณาเชื่อมต่อ GitHub ก่อน'); return; }
    state.saving = true; render();

    var uploadJobs = [];
    state.products.forEach(function(p){
      p.images.forEach(function(im, idx){
        if (im.type === 'new'){
          uploadJobs.push({ p:p, idx:idx });
        }
      });
    });

    var chain = Promise.resolve();
    uploadJobs.forEach(function(job){
      chain = chain.then(function(){
        var path = 'images/' + job.p.id + '-' + job.idx + '-' + Date.now().toString(36) + '.jpg';
        return GH.putImage(CONFIG.owner, CONFIG.publicRepo, path, job.p.images[job.idx].dataUrl, state.token, 'add image: ' + job.p.name)
          .then(function(){ job.p.images[job.idx] = { type:'existing', path:path, url: rawUrl(path) }; });
      });
    });

    chain.then(function(){
      var publicProducts = state.products.map(function(p){
        return {
          id: p.id, name: p.name, brand: p.brand, category: p.category, description: p.description,
          price: p.price, images: p.images.map(function(im){ return im.path; }),
          sku: p.sku||'', unit: p.unit||'', status: p.status||'available', updatedAt: p.updatedAt
        };
      });
      var publicDoc = { business: state.business, products: publicProducts };
      return GH.putJson(CONFIG.owner, CONFIG.publicRepo, CONFIG.publicDataPath, publicDoc, state.publicSha, state.token, 'update catalog data');
    }).then(function(pubRes){
      state.publicSha = pubRes.sha;
      var costs = {};
      state.products.forEach(function(p){
        if (p.cost !== '' || p.supplier) costs[p.id] = { cost: p.cost===''?0:Number(p.cost), supplier: p.supplier||'' };
      });
      return GH.putJson(CONFIG.owner, CONFIG.internalRepo, CONFIG.internalDataPath, { costs: costs }, state.internalSha, state.token, 'update internal cost data');
    }).then(function(intRes){
      state.internalSha = intRes.sha;
      state.saving = false;
      render();
      toast('บันทึกและเผยแพร่แล้ว — เว็บสาธารณะจะอัปเดตภายในประมาณ 1 นาที');
    }).catch(function(err){
      state.saving = false;
      render();
      toast('บันทึกไม่สำเร็จ: ' + describeError(err));
    });
  }

  boot();
})();
</script>
